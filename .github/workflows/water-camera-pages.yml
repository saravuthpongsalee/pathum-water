name: Update Pathum Thani camera stills

on:
  workflow_dispatch:
  schedule:
    # GitHub may delay or omit scheduled runs; the device rejects old timestamps.
    - cron: '3-59/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pathum-water-pages
  cancel-in-progress: true

jobs:
  capture-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: "sudo apt-get update -qq && sudo apt-get install -y ffmpeg && command -v ffmpeg"
      - name: Capture fresh frames or record unavailable source
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          python CLOUD_FRAME_CAPTURE.py --output _site/cam
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
